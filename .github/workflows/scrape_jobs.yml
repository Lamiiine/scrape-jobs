name: Daily Job Scraper

on:
  workflow_dispatch:
    inputs:
      dry_run_social:
        description: Preview the Telegram and LinkedIn posts in the log without sending them
        type: boolean
        default: false
  schedule:
    # 06:00 UTC. ubuntu-latest is Ubuntu 26.04; do not pin Python 3.9.
    - cron: "0 6 * * *"

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12.x is published for Ubuntu 26.04. 3.9 is not, which is why
          # the 18 Nov 2026 run died in setup-python before scrape.py started.
          python-version: "3.12"

      - name: Run scraper and publish to visajobs.xyz
        env:
          SITE_GITHUB_TOKEN: ${{ secrets.SITE_GITHUB_TOKEN }}
          SITE_REPO: relocate-with-us/relocate-with-us.github.io
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          LINKEDIN_REFRESH_TOKEN: ${{ secrets.LINKEDIN_REFRESH_TOKEN }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_ID: ${{ secrets.LINKEDIN_ORGANIZATION_ID }}
          DRY_RUN_SOCIAL: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run_social == 'true' && '1' || '0' }}
        run: python scrape.py

      - name: Commit scraper output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/latest-jobs.json
          if [ -f data/posted-ids.json ]; then git add data/posted-ids.json; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update visa sponsorship jobs"
            git push
          fi
